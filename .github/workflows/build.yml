name: Build

# Runs on every push (any branch) so each change is tested and built for
# Windows and macOS. When a release is published, the installers and their
# .sha256 files are attached to that release.
on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  check:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Core library tests
        run: cargo test -p receitas-core
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: UI type check
        shell: bash
        run: |
          set -o pipefail
          npx svelte-check --tsconfig ./tsconfig.json --output machine | tee check.txt || {
            grep -E " (ERROR|WARNING) " check.txt | while read -r _ level file pos msg; do
              echo "::error file=$file::$level $pos $msg"
            done
            exit 1
          }
      - name: UI build
        run: npm run build

  build:
    name: Build ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            bundles: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
          - name: macOS
            os: macos-latest
            args: "--target universal-apple-darwin"
            bundles: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Build installers
        run: npx tauri build ${{ matrix.args }}
      - name: Collect installers and checksums
        shell: bash
        run: |
          mkdir -p out
          for f in ${{ matrix.bundles }}; do
            [ -f "$f" ] || continue
            cp "$f" out/
          done
          cd out
          for f in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          done
          ls -la
          [ "$(ls | wc -l)" -gt 0 ]
      - uses: actions/upload-artifact@v4
        with:
          name: LolosReceitas-${{ matrix.name }}
          path: out/*
      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/* --clobber
